upstream backend {
    server backend:8000;
}
upstream frontend {
    server frontend:5173;
}

# ---------- HTTP: только ACME-челлендж и редирект на HTTPS ----------
server {
    listen 80;
    server_name neftesoft.ru www.neftesoft.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

