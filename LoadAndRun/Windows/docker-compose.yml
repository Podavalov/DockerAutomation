name: eye_of_reservoir
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: eye_of_reservoir_encrypted-backend:latest
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    ports:
      - "8001:8000"

  celery:
    image: eye_of_reservoir_encrypted-celery:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    image: eye_of_reservoir_encrypted-celery-beat:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: eye_of_reservoir_encrypted-frontend:latest
    env_file: .env
    expose:
      - "5173"
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  static_volume:
  media_volume:
  postgres_data: