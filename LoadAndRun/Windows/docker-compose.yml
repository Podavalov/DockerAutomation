services:
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: eye_of_reservoir-backend
    environment:
      SECRET_KEY: django-insecure-dev-only-change-me
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 6438
      DATABASE_URL: postgresql://postgres:6438@193.168.198.166:5432/postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
      KRON_MNKT_API_BASE_URL: http://192.168.33.178:3535/api/kron-mnkt
      KRON_MNKT_API_LOGIN: ""
      KRON_MNKT_API_PASSWORD: ""
      RUN_MIGRATIONS: "1"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  celery:
    image: eye_of_reservoir-celery
    environment:
      SECRET_KEY: django-insecure-dev-only-change-me
      DEBUG: "True"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 6438
      DATABASE_URL: postgresql://postgres:6438@193.168.198.166:5432/postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
      KRON_MNKT_API_BASE_URL: http://192.168.33.178:3535/api/kron-mnkt
      KRON_MNKT_API_LOGIN: ""
      KRON_MNKT_API_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A eye_of_the_reservoir worker -l info

  celery-beat:
    image: eye_of_reservoir-celery-beat
    environment:
      SECRET_KEY: django-insecure-dev-only-change-me
      DEBUG: "True"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 6438
      DATABASE_URL: postgresql://postgres:6438@193.168.198.166:5432/postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
      KRON_MNKT_API_BASE_URL: http://192.168.33.178:3535/api/kron-mnkt
      KRON_MNKT_API_LOGIN: ""
      KRON_MNKT_API_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A eye_of_the_reservoir beat -l info

  frontend:
    image: eye_of_reservoir-frontend
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro